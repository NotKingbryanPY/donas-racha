name: Firestore preference security
on:
  pull_request:
    paths: ["firestore.rules", "tests/firestore-rules.cjs", ".github/workflows/firestore-rules.yml"]
  push:
    branches: [main, "codex/**"]
    paths: ["firestore.rules", "tests/firestore-rules.cjs", ".github/workflows/firestore-rules.yml"]
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install official emulator test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/firebase-test" --no-audit --no-fund firebase@13.0.0 @firebase/rules-unit-testing@6.0.0 firebase-tools@15.33.0
          echo "NODE_PATH=$RUNNER_TEMP/firebase-test/node_modules" >> "$GITHUB_ENV"
      - name: Exercise owner and schema restrictions in demo project
        run: |
          "$RUNNER_TEMP/firebase-test/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-donas-rules "node tests/firestore-rules.cjs"
