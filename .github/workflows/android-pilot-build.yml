name: Android official validation

on:
  push:
    branches: ["codex/**", main]
    paths:
      - "android/donas-control/**"
      - ".github/workflows/android-pilot-build.yml"
  pull_request:
    paths:
      - "android/donas-control/**"
      - ".github/workflows/android-pilot-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse pilot debug signature
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: donas-pilot-debug-signing-v1
      - name: Create isolated signing key for emulator validation
        shell: bash
        run: |
          STORE="$RUNNER_TEMP/validation.keystore"
          keytool -genkeypair -keystore "$STORE" -storepass validation-only -keypass validation-only -alias validation -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=CI validation only'
          echo "DONAS_OFFICIAL_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo 'DONAS_OFFICIAL_STORE_PASSWORD=validation-only' >> "$GITHUB_ENV"
          echo 'DONAS_OFFICIAL_KEY_ALIAS=validation' >> "$GITHUB_ENV"
          echo 'DONAS_OFFICIAL_KEY_PASSWORD=validation-only' >> "$GITHUB_ENV"
      - name: Build, test and lint
        working-directory: android/donas-control
        env:
          ORG_GRADLE_PROJECT_FIREBASE_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          ORG_GRADLE_PROJECT_FIREBASE_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
          ORG_GRADLE_PROJECT_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
        run: bash ./gradlew testDebugUnitTest assembleOfficial lintDebug lintOfficial assembleDebugAndroidTest
      - name: Save official APK and release mapping
        uses: actions/upload-artifact@v4
        with:
          name: donas-control-official-validation-only
          path: |
            android/donas-control/app/build/outputs/apk/official/app-official.apk
            android/donas-control/app/build/outputs/mapping/official/mapping.txt
          if-no-files-found: error

  devices:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: donas-pilot-debug-signing-v1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create isolated signing key for device tests
        run: |
          STORE="$RUNNER_TEMP/validation.keystore"
          keytool -genkeypair -keystore "$STORE" -storepass validation-only -keypass validation-only -alias validation -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=CI validation only'
          echo "DONAS_OFFICIAL_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo 'DONAS_OFFICIAL_STORE_PASSWORD=validation-only' >> "$GITHUB_ENV"
          echo 'DONAS_OFFICIAL_KEY_ALIAS=validation' >> "$GITHUB_ENV"
          echo 'DONAS_OFFICIAL_KEY_PASSWORD=validation-only' >> "$GITHUB_ENV"
      - name: Test optimized official app on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android/donas-control
          script: |
            bash ./gradlew -PDEVICE_TEST_BUILD=official connectedOfficialAndroidTest
            adb shell am start -W -n com.bryan.donas.control/com.bryan.donas.ui.MainActivity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-device-tests-api-${{ matrix.api }}
          path: android/donas-control/app/build/reports/androidTests/connected/**
