name: Android pilot build

on:
  push:
    branches: ["codex/**", main]
    paths:
      - "android/donas-control/**"
      - ".github/workflows/android-pilot-build.yml"
  pull_request:
    paths:
      - "android/donas-control/**"
      - ".github/workflows/android-pilot-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        working-directory: android/donas-control
        run: bash ./gradlew testDebugUnitTest assemblePilot lintDebug
      - name: Save pilot APK
        uses: actions/upload-artifact@v4
        with:
          name: donas-control-pilot
          path: android/donas-control/app/build/outputs/apk/pilot/app-pilot.apk
          if-no-files-found: error
