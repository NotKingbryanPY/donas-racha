name: Publish signed Android 1.3.0

on:
  push:
    branches: [codex/publish-android-official-1.3.0]
    paths:
      - releases/android/1.3.0-oficial/**
      - .github/workflows/publish-android-official.yml

permissions:
  contents: write

concurrency:
  group: publish-donas-control-1.3.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed artifact and publish release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');
            const directory = 'releases/android/1.3.0-oficial';
            const tag = 'donas-control-v1.3.0';
            const sourceCommit = '7cd501bf1055a45c9169d1aa798af68bea852867';
            const expectedHash = '427562f9cd71710c9036b2d4fee647b13c24676d25ae6c1e1a79e7b697e1233d';
            const names = ['Donas-Control-1.3.0-oficial.apk', 'Donas-Control-1.3.0-oficial.apk.sha256', 'Donas-Control-1.3.0-validacion.json', 'INSTALACION.md'];
            const files = names.map(name => ({name, data: fs.readFileSync(path.join(directory, name))}));
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            if (hash(files[0].data) !== expectedHash) throw new Error('APK hash differs from the verified permanent-signed artifact');
            const report = JSON.parse(files[2].data.toString('utf8').replace(/^\uFEFF/, ''));
            if (report.apkSha256 !== expectedHash || report.sourceCommit !== sourceCommit || report.certificateSha256 !== '5681a1329740c46b2c7a718e3e8a431951c7b6486fc625196dc3dd7ecadb249d' || report.deviceTests.status !== 'passed') throw new Error('Validation report does not match this APK');
            const body = files[3].data.toString('utf8');
            const {owner, repo} = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag, target_commitish: sourceCommit, name: 'Donas Control 1.3.0 oficial', body, draft: true, prerelease: false})).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {owner, repo, release_id: release.id});
            for (const file of files) {
              const existing = assets.find(asset => asset.name === file.name);
              const digest = 'sha256:' + hash(file.data);
              if (existing && existing.digest === digest) continue;
              if (existing) throw new Error('Existing release asset has another digest; refusing to replace: ' + file.name);
              await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id, name: file.name, data: file.data, headers: {'content-type': file.name.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'application/octet-stream', 'content-length': file.data.length}});
            }
            if (release.draft) await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, prerelease: false, make_latest: 'true'});
            core.info('Published: https://github.com/' + owner + '/' + repo + '/releases/tag/' + tag);
