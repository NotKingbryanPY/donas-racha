name: Shared inventory and mobile API tests
concurrency:
  group: mobile-contracts-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: ["codex/**", main]
    paths: ["api/**", "supabase/**", "tests/**", "assets/**", "index.html", "package*.json", ".github/workflows/mobile-contracts.yml"]
  pull_request:
    paths: ["api/**", "supabase/**", "tests/**", "assets/**", "index.html", "package*.json", ".github/workflows/mobile-contracts.yml"]
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API, session and push contracts
        run: |
          node tests/session-resilience.cjs
          node tests/order-push.cjs
          node tests/shared-inventory-refresh.cjs
          node tests/public-realtime-config.cjs
          node tests/catalog-realtime.cjs
          node tests/inventory-revision-api.cjs
          node tests/device-restore-api.cjs
          node tests/full-supabase-backend.cjs
          node tests/security-contract.cjs
          node tests/web-script-syntax.cjs
          node tests/customer-order-auth.cjs
          node tests/pilot-device-auth.cjs
          node tests/notification-order-api.cjs
          npm ci --no-audit --no-fund
          node tests/firebase-staff-auth.cjs
          node tests/firebase-identity-api.cjs
          node tests/staff-device-list.cjs
      - name: Install pinned PostgreSQL test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/donas-pg" --no-audit --no-fund @electric-sql/pglite@0.5.8
          echo "PGLITE_MODULE=file://$RUNNER_TEMP/donas-pg/node_modules/@electric-sql/pglite/dist/index.js" >> "$GITHUB_ENV"
      - name: Apply migrations and exercise shared stock and roles
        run: |
          node tests/shared-inventory-postgres.mjs
          node tests/seller-role-postgres.mjs
          node tests/manual-inventory-postgres.mjs
          node tests/pilot-catalog-postgres.mjs
          node tests/three-daily-purchases-postgres.mjs
          node tests/preflight-cutover-postgres.mjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/donas-browser" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/donas-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/donas-browser/node_modules" >> "$GITHUB_ENV"
      - name: Exercise profile, orders and the real catalog SDK with simulated providers
        run: |
          node tests/serve-fixture.cjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/integration-order-web.cjs
          node tests/catalog-realtime-web.cjs
  concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: donas_concurrency
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client for tests
        run: |
          npm install --prefix "$RUNNER_TEMP/donas-pg-client" --no-audit --no-fund pg@8.16.3
          echo "POSTGRES_MODULE=file://$RUNNER_TEMP/donas-pg-client/node_modules/pg/lib/index.js" >> "$GITHUB_ENV"
      - name: Exercise competing devices against PostgreSQL
        env:
          POSTGRES_TEST_URL: postgresql://postgres:test-only-password@localhost:5432/donas_concurrency
        run: node tests/shared-inventory-postgres.mjs
