name: Knowledge references and freshness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Identify affected areas and verify reviewed sources
        run: |
          python scripts/knowledge.py report
          python scripts/knowledge.py check --fresh
      - name: Test incremental indexing in isolated Git fixtures
        run: python tests/knowledge-system.py
