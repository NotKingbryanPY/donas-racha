name: DonasControlOffline
options:
  bundleIdPrefix: com.bryan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  DonasControlOffline:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryan.donascontrol.offline
        INFOPLIST_KEY_CFBundleDisplayName: Donas Control Offline
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Donas Control Offline
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/DonasControlOffline.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bryan.donascontrol.offline
    dependencies:
      - target: DonasWidgetExtension
        embed: true
        codeSign: true
  DonasWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryan.donascontrol.offline.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Donas Venta Rápida
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DonasWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bryan.donascontrol.offline
