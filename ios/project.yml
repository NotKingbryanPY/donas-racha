name: DonasControl
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "9"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  DonasControl:
    type: application
    platform: iOS
    sources:
      - path: DonasControl.swift
      - path: Core
      - path: App
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bryan.donas.control
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: DonasControl-debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: DonasControl-release.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Donas Control
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.bryan.donas.control.refresh]
        UIApplicationSupportsIndirectInputEvents: true
schemes:
  DonasControl:
    build:
      targets:
        DonasControl: all
