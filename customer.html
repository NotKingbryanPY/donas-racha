<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi cuenta · Donas Racha</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;background:#171021;color:#fff}main{max-width:560px;margin:auto;padding:24px}
.card{background:#271a38;border:1px solid #4a365f;border-radius:18px;padding:20px;margin:18px 0}
input,button{font:inherit;border-radius:10px;padding:12px}input{width:100%;box-sizing:border-box;background:#fff;color:#111;border:0;margin:6px 0 12px}
button{border:0;background:#ffcf58;color:#25142c;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
#qr svg{display:block;max-width:100%;height:auto;margin:18px auto;background:white;padding:12px;border-radius:12px}
.muted{color:#d7cbe3}a{color:#ffcf58}#message{min-height:24px}
</style></head><body><main>
<p><a href="/">← Donas Racha</a></p><h1>Mi cuenta</h1>
<section id="login" class="card"><h2>Entrar</h2><form id="loginForm">
<label>Correo<input id="email" type="email" autocomplete="username" required></label>
<label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
<button>Iniciar sesión</button></form></section>
<section id="account" class="card" hidden><h2 id="name">Cliente</h2><p id="points"></p>
<p class="muted">Muestra este QR al vendedor. Caduca en cinco minutos; genera uno nuevo cuando haga falta.</p>
<button id="newQr">Generar QR</button> <button id="logout">Salir</button>
<div id="qr" role="img" aria-label="Código QR temporal del cliente"></div><p id="expires" class="muted"></p>
</section><p id="message" role="status"></p>
</main><script src="/assets/js/vendor/qrcode.js"></script><script>
(() => {
  let accessToken = null, expiryTimer = null;
  const $ = id => document.getElementById(id);
  async function call(path, options={}) {
    const res = await fetch(path,{...options,headers:{'content-type':'application/json',...(accessToken?{authorization:`Bearer ${accessToken}`}:{})}});
    const body = await res.json();
    if (!res.ok || !body.ok) throw new Error(body.error?.message || 'No se pudo completar la operación.');
    return body.data;
  }
  function message(value){ $('message').textContent=value; }
  function clearQr(){ $('qr').replaceChildren(); $('expires').textContent=''; if(expiryTimer) clearTimeout(expiryTimer); }
  $('loginForm').addEventListener('submit', async event => {
    event.preventDefault(); message('Entrando…');
    try {
      const session = await call('/api/customer/session',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});
      accessToken = session.accessToken; $('password').value='';
      const [profile,loyalty] = await Promise.all([call('/api/customer/profile'),call('/api/customer/loyalty')]);
      $('name').textContent = profile.customer.display_name;
      $('points').textContent = `${loyalty.account?.available_points || 0} puntos disponibles · ${loyalty.account?.purchase_count || 0} compras`;
      $('login').hidden=true; $('account').hidden=false; message('');
    } catch(error){ accessToken=null; message(error.message); }
  });
  $('newQr').addEventListener('click', async () => {
    clearQr(); message('Generando QR…');
    try {
      const {qr:issued} = await call('/api/customer/qr',{method:'POST'});
      const code = qrcode(0,'M'); code.addData(issued.token); code.make();
      $('qr').innerHTML=code.createSvgTag(6,4);
      $('expires').textContent=`Válido hasta ${new Date(issued.expires_at).toLocaleTimeString('es-PA')}`;
      expiryTimer=setTimeout(() => { clearQr(); message('El QR caducó. Genera uno nuevo.'); }, Math.max(0,new Date(issued.expires_at).getTime()-Date.now()));
      message('');
    } catch(error){ message(error.message); }
  });
  $('logout').addEventListener('click', () => { accessToken=null; clearQr(); $('account').hidden=true; $('login').hidden=false; message('Sesión cerrada.'); });
})();
</script></body></html>
